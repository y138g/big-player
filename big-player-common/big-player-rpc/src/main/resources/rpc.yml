dubbo:
  consumer:
    timeout: 12000
    check: false
  protocol:
    name: dubbo
    port: -1
  registry:
    address: nacos://${big.player.nacos.server.url}
    parameters:
      namespace: ${big.player.dubbo.nacos.namespace}
      group: ${big.player.dubbo.nacos.group}
  application:
    name: ${spring.application.name}
    qos-enable: true
    qos-accept-foreign-ip: false
    service-discovery:
      migration: FORCE_INTERFACE
    register-mode: all
